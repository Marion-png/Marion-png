name: Generate Snake

on:
  # runs automatically once a day (midnight UTC = 8 AM Manila)
  schedule:
    - cron: "0 0 * * *"
  # lets you run it manually from the Actions tab
  workflow_dispatch:
  # runs every time you push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Builds the snake animation from your contribution graph.
      # Change the colors here:
      #   color_snake = the snake's color
      #   color_dots  = 5 colors: empty square, then lowest -> highest contributions
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#8250df&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#a371f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Pushes the generated SVGs to a branch called "output"
      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
